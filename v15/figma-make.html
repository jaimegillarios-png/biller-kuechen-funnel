<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biller küchen · Küchenplaner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F2F4F7;
      --bg-2: #E5E8EC;
      --paper: #FFFFFF;
      --paper-2: #FFFFFF;
      --ink: #2B3136;
      --ink-2: #4B5159;
      --ink-3: #707681;
      --ink-4: #A8ADB5;
      --line: rgba(43, 49, 54, 0.10);
      --line-2: rgba(43, 49, 54, 0.16);
      --accent: #781e39;
      --accent-soft: #F7EDF0;
      --radius: 14px;
      --shadow-card: 0 1px 0 rgba(26,29,27,0.04), 0 12px 40px -16px rgba(26,29,27,0.12);
      --t: 220ms cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "ss01", "cv11";
    }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select { font-family: inherit; color: inherit; }
    a { color: var(--ink-2); }

    .page {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px;
      background:
        radial-gradient(1200px 600px at 50% 20%, rgba(26,29,27,0.10), transparent 60%),
        rgba(26, 29, 27, 0.55);
      backdrop-filter: blur(2px);
    }
    /* When embedded inside another page (v10 modal), let the parent handle the
       backdrop — drop our own dim layer so the modal sits cleanly on the host. */
    html.embedded, html.embedded body, html.embedded #root { height: 100%; overflow: hidden; margin: 0; }
    /* Standalone-iframed: keep the centered-card layout but drop our own
       backdrop so the host's overlay shows through. */
    html.iframed-standalone, html.iframed-standalone body, html.iframed-standalone #root { margin: 0; background: transparent !important; }
    html.iframed-standalone .page {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    /* Desktop: anchor the iframed funnel near the top of the viewport
       instead of vertically centering it. */
    @media (min-width: 880px) {
      html.iframed-standalone .page {
        justify-content: flex-start;
        padding-top: 8vh;
      }
    }
    .embedded .page {
      padding: 0;
      background: transparent;
      backdrop-filter: none;
      justify-content: flex-start;
      align-items: stretch;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    .embedded .card {
      max-width: none;
      flex: 1 1 100%;
      min-height: 0;
      max-height: 100%;
      border-radius: 0;
      border: 0;
      box-shadow: none;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .embedded .card-body {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .embedded .card-body::-webkit-scrollbar { width: 8px; }
    .embedded .card-body::-webkit-scrollbar-thumb { background: rgba(43,49,54,0.18); border-radius: 4px; }
    .embedded .card-body::-webkit-scrollbar-thumb:hover { background: rgba(43,49,54,0.28); }

    .card {
      width: 100%;
      max-width: 850px;
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid rgba(0,0,0,0.35);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.45);
      overflow: hidden;
      position: relative;
    }
    .card-body {
      padding: 10px 36px 36px;
      min-height: 600px;
      display: flex; flex-direction: column;
    }

    /* review bar — slim banner inside modal */
    /* variant=B → No trust bar (and balance card padding on all sides) */
    html.variant-B .review-bar { display: none; }
    html.variant-B .card-body { padding: 32px; }
    @media (max-width: 880px) {
      html.variant-B .card-body { padding: 24px; }
    }
    /* variant=C → "Compact": very light grey body so the white option
       cards stand out more clearly against the background. */
    html.variant-C .card-body { background: #F8F8F9; }
    .review-bar {
      width: 100%;
      background: #3F141E;
      color: #FBFAF7;
      font-size: 12.5px;
      letter-spacing: 0.005em;
    }
    .review-bar-inner {
      max-width: 920px;
      margin: 0 auto;
      padding: 8px 36px;
      display: flex; align-items: center;
      gap: 12px;
      min-height: 34px;
    }
    .review-cluster { display: flex; align-items: center; gap: 10px; }
    .review-divider {
      width: 1px; height: 13px;
      background: rgba(255,255,255,0.20);
      flex-shrink: 0;
    }
    .review-rating { display: flex; align-items: center; gap: 6px; }
    .review-rating strong {
      font-weight: 600; font-size: 13px;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.005em;
    }
    .stars { display: inline-flex; gap: 1px; color: #F1C84B; }
    .stars svg { width: 11px; height: 11px; }
    .review-source {
      display: inline-flex; align-items: center; gap: 6px;
      color: rgba(251,250,247,0.80);
    }
    .review-source svg { width: 12px; height: 12px; }
    .review-source-text { font-weight: 500; }
    .review-trust {
      margin-left: auto; display: inline-flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 500;
      color: rgba(251,250,247,0.90);
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
    }
    .status-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: oklch(70% 0.15 150);
      box-shadow: 0 0 0 3px oklch(70% 0.15 150 / 0.20);
      animation: pulse-dot 2.4s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 4px oklch(70% 0.15 150 / 0.18); }
      50%      { box-shadow: 0 0 0 6px oklch(70% 0.15 150 / 0.10); }
    }

    /* nav */
    .nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 0 10px;
    }
    .nav > * { align-self: center; line-height: 1; }
    .nav .back-btn { justify-self: start; }
    .nav .brand    { justify-self: center; }
    .nav .step-counter { justify-self: end; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--ink-2);
      padding: 8px 12px; margin-left: 0;
      border-radius: 10px;
      transition: var(--t);
    }
    .back-btn svg { width: 16px; height: 16px; }
    .back-btn:hover:not(:disabled) { background: var(--bg-2); color: var(--ink); }
    .back-btn:disabled { opacity: 0; pointer-events: none; }
    .brand { display: inline-flex; align-items: center; }
    .brand img { display: block; height: 48px; width: auto; }
    .step-counter {
      font-variant-numeric: tabular-nums;
      font-size: 13px; color: var(--ink-3); letter-spacing: 0.04em;
    }
    .step-counter .step-num { color: var(--ink); font-weight: 600; }
    .step-counter .step-sep { margin: 0 2px; color: var(--ink-4); }
    /* Mobile-only: close button (in nav, where step counter sat) and a
       fixed step pill pinned to the bottom-right of the viewport. */
    .nav .nav-close {
      justify-self: end;
      display: none;
      width: 32px; height: 32px;
      align-items: center; justify-content: center;
      border-radius: 999px;
      color: var(--ink-2);
      background: transparent;
      border: 0;
      transition: var(--t);
    }
    .nav .nav-close:hover { background: var(--bg-2); color: var(--ink); }
    .step-pill { display: none; }

    /* progress */
    .progress {
      position: relative; width: 100%; height: 2px;
      margin-bottom: 32px; border-radius: 2px; overflow: hidden;
    }
    .progress-track { position: absolute; inset: 0; background: var(--line); }
    .progress-fill {
      position: absolute; inset: 0 auto 0 0;
      background: var(--accent);
      border-radius: 2px;
      transition: width 480ms cubic-bezier(.2,.7,.2,1);
    }

    /* step */
    .step-content { flex: 1; display: flex; flex-direction: column; animation: fadeUp 320ms cubic-bezier(.2,.7,.2,1); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .header { margin-bottom: 32px; text-align: center; }
    .title {
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 24px; line-height: 1.18;
      letter-spacing: -0.02em; margin: 0 0 14px;
      color: var(--ink); text-wrap: balance;
    }
    .subtitle { margin: 0; font-size: 14px; color: var(--ink-3); text-wrap: pretty; }

    /* grid */
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    }
    .grid-cols-2 { --cols: 2; max-width: 600px; margin: 0 auto; width: 100%; }
    .grid-cols-3 { --cols: 3; }
    .grid-cols-4 { --cols: 4; }
    .grid-cols-5 { --cols: 5; }

    .opt-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px;
      padding: 10px 10px 12px;
      background: var(--paper-2);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      text-align: center;
      transition: transform var(--t), border-color var(--t), box-shadow var(--t), background var(--t);
      isolation: isolate;
    }
    .opt-card:hover {
      border-color: var(--line-2);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px -10px rgba(26,29,27,0.14);
    }
    .opt-card.is-selected {
      border-color: var(--accent);
      background: var(--paper-2);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 14px 32px -14px rgba(120, 30, 57, 0.40);
    }
    .opt-glyph {
      display: block; width: 100%;
      max-width: 150px;
      margin: 0 auto;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      overflow: hidden;
      aspect-ratio: 4/3;
      padding: 0; position: relative;
    }
    .opt-glyph .shape-svg { display: block; width: 100%; height: 100%; }
    .opt-glyph .iso-stage { padding: 6px; }

    /* File-based Glyph component. Each glyph file keeps its own native
       proportions; per-category padding gives every option card a
       consistent visual footprint without distorting the artwork. */
    .opt-glyph .glyph {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 10px;
    }
    .opt-glyph .glyph > svg {
      display: block;
      width: 100%; height: 100%;
      max-width: 100%; max-height: 100%;
    }
    /* Location glyphs are still on their legacy viewBoxes, so they need
       extra inset. Remove when those are redrawn at 80×60. */
    .opt-glyph .glyph--location { padding: 22px; }
    .opt-glyph .opt-bitmap {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 22px;
    }
    .opt-glyph .opt-bitmap > svg {
      display: block;
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
    }
    /* Thicken the line work in the supplied SVGs. The icon files draw
       outlines as thin filled shapes (.cls-1) with stroke-width:0; layering
       a stroke on top widens the perceived line. */
    .opt-glyph .opt-bitmap > svg .cls-1 {
      stroke: #3F4644;
      stroke-width: 1.15;
      stroke-linejoin: round;
      stroke-linecap: round;
      fill: #3F4644;
    }
    /* Unify icon line color across all glyph variants — inline iso SVGs,
       supplied SVG files, and budget illustrations. Targets every common
       way "black" is encoded in the source markup. */
    .opt-glyph svg [fill="black"],
    .opt-glyph svg [fill="#000"],
    .opt-glyph svg [fill="#000000"],
    .opt-glyph svg [fill="#1A1D1B"],
    .opt-glyph svg [fill="#1a1d1b"] {
      fill: #3F4644;
    }
    .opt-glyph svg [stroke="black"],
    .opt-glyph svg [stroke="#000"],
    .opt-glyph svg [stroke="#000000"],
    .opt-glyph svg [stroke="#1A1D1B"],
    .opt-glyph svg [stroke="#1a1d1b"] {
      stroke: #3F4644;
    }
    .opt-meta { display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; width: 100%; }
    .opt-label { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
    .opt-hint { display: block; font-size: 12px; color: var(--ink-3); }

    .opt-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--ink-4);
      border: 1.5px solid transparent;
      color: white;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transform: scale(.6); transition: var(--t);
      z-index: 2;
    }
    .opt-card.is-selected .opt-check {
      opacity: 1; transform: scale(1);
      background: var(--accent); border-color: var(--accent); color: white;
    }

    /* fallback */
    .fallback {
      margin-top: 16px; width: 100%;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      border: 1.5px dashed var(--line-2);
      background: transparent;
      color: var(--ink-2);
      font-weight: 500; font-size: 13px;
      transition: var(--t);
    }
    .fallback:hover { background: var(--bg-2); border-style: solid; }
    .fallback.is-selected {
      border-color: var(--accent); border-style: solid;
      background: var(--accent-soft); color: var(--ink);
    }

    /* form */
    .form-step { display: flex; flex-direction: column; gap: 14px; max-width: 440px; margin: 0 auto; width: 100%; }
    .anrede {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .anrede-opt {
      padding: 8px 10px; border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--paper-2);
      font-size: 13px; font-weight: 500; color: var(--ink-2);
      transition: var(--t);
    }
    .anrede-opt:hover { border-color: var(--line-2); }
    .anrede-opt.is-selected {
      border-color: var(--accent); background: var(--accent-soft); color: var(--ink);
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
    .field-half { grid-column: span 1; }
    .field-label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
    .input {
      width: 100%; padding: 11px 14px;
      border-radius: 10px; border: 1.5px solid var(--line);
      background: var(--paper-2); font-size: 14px; color: var(--ink);
      outline: none; transition: var(--t);
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .field.has-error .input { border-color: oklch(58% 0.16 25); }
    .field-err { font-size: 12px; color: oklch(50% 0.16 25); }

    .phone-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: stretch; }
    .phone-country {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px; border: 1.5px solid var(--line);
      background: var(--paper-2); font-size: 14px; color: var(--ink);
      outline: none; transition: var(--t);
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%236E726F' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 28px;
    }
    .phone-country:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .form-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 13px 20px;
      background: var(--ink); color: var(--paper);
      border-radius: 12px;
      font-size: 14px; font-weight: 500;
      transition: var(--t);
      box-shadow: 0 6px 18px -8px rgba(26,29,27,0.4);
      width: 100%;
    }
    .form-cta:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px -10px rgba(26,29,27,0.45);
    }
    .form-cta:disabled { background: var(--ink-4); cursor: not-allowed; box-shadow: none; }

    .ssl-pill {
      display: inline-flex; align-items: center; gap: 6px;
      align-self: center;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-2);
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink-3);
      text-transform: uppercase;
    }
    .legal {
      font-size: 12px; line-height: 1.55;
      color: var(--ink-3);
      text-align: center;
    }
    .legal a { color: var(--ink-2); text-decoration: underline; text-underline-offset: 2px; }

    /* CTA row (form only) */
    .cta-row {
      margin-top: 8px;
      display: flex; flex-direction: column; gap: 10px; align-items: stretch;
    }

    /* success */
    .success {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 24px 0;
      animation: fadeUp 360ms cubic-bezier(.2,.7,.2,1);
    }
    .success-icon {
      margin-bottom: 18px; background: var(--accent-soft);
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center;
    }
    .success-title { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -0.02em; margin: 0 0 8px; }
    .success-sub { margin: 0 0 32px; color: var(--ink-3); max-width: 480px; }
    .success-summary {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      width: 100%; max-width: 640px;
    }
    .success-summary > div {
      padding: 14px; border-radius: 12px; background: var(--bg-2);
      display: flex; flex-direction: column; gap: 4px; text-align: left;
    }
    .success-summary span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
    .success-summary strong { font-size: 14px; font-weight: 600; color: var(--ink); }

    /* brand strip */
    .brand-strip {
      border-top: 1px solid var(--line);
      padding: 12px 60px;
      display: flex; align-items: center; gap: 24px;
      background: var(--paper);
    }
    .brand-strip-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-4); white-space: nowrap; }
    .brand-list { flex: 1; display: flex; align-items: center; justify-content: space-around; gap: 18px; flex-wrap: wrap; }
    .brand-item {
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 14px; letter-spacing: 0.04em;
      color: var(--ink-3); opacity: 0.85;
      transition: var(--t);
    }

    /* reassurance strip — sits flush at the bottom of the card */
    .reassure {
      margin: 0;
      width: 100%;
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      padding: 0 36px;
      box-shadow: none;
    }
    .reassure-item {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 16px 18px;
      transition: background var(--t);
      border-radius: 14px;
    }
    .reassure-item:not(:last-child)::after {
      content: "";
      position: absolute; right: 0; top: 22%; bottom: 22%;
      width: 1px; background: var(--line);
    }
    .reassure-icon {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .reassure-t {
      font-size: 13px; font-weight: 600; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .reassure-s { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

    /* responsive */
    @media (max-width: 1100px) {
      .card-body { padding: 20px 36px 28px; }
    }
    @media (max-width: 880px) {
      .page {
        padding: 0;
        background: var(--bg);
        backdrop-filter: none;
        justify-content: flex-start;
        align-items: stretch;
      }
      html.iframed-standalone .page { background: transparent; }
      .card {
        border-radius: 0;
        border: 0;
        box-shadow: none;
        max-width: none;
      }
      .card-body { padding: 12px 16px 16px; min-height: calc(100vh - 60px); }
      .nav { padding: 4px 0 10px; }
      /* Swap step counter for the close button in the nav */
      .nav .step-counter { display: none; }
      .nav .nav-close { display: inline-flex; width: 40px; height: 40px; }
      .nav .nav-close svg { width: 18px; height: 18px; }
      /* Bigger back-button touch target on mobile */
      .nav .back-btn { font-size: 15px; padding: 10px 14px; gap: 8px; }
      .nav .back-btn svg { width: 20px; height: 20px; }
      /* Step counter becomes a fixed pill anchored bottom-right */
      .step-pill {
        display: inline-block;
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 12px;
        background: rgba(20,17,15,0.85);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 60;
        pointer-events: none;
      }
      .progress { margin-bottom: 32px; }
      .header { margin-bottom: 36px; }
      .title { margin-bottom: 14px; }

        name: contact.name.trim().length < 2 ? "Bitte Vor- und Nachname angeben" : null,
        email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email) ? "Bitte gültige E-Mail-Adresse" : null,
        phone: contact.phone.replace(/\D/g, "").length < 6 ? "Bitte Telefonnummer" : null,
        plz: !/^\d{4,5}$/.test(contact.plz) ? "Bitte gültige PLZ" : null,
      }), [contact]);

      const formValid = !errs.name && !errs.email && !errs.phone && !errs.plz;

      function pick(stepId, value) {
        setAnswers((a) => ({ ...a, [stepId]: value }));
        if (STEPS.find(s => s.id === stepId).type !== "form") {
          setTimeout(() => setStepIdx((i) => Math.min(i + 1, total - 1)), 320);
        }
      }
      function back() { setStepIdx((i) => Math.max(0, i - 1)); }
      function submit() {
        setTouched({ name: true, email: true, phone: true, plz: true });
        if (formValid) setSubmitted(true);
      }

      return (
        <div className="page">
          <div className="card">
            <ReviewBar />
            <div className="card-body">
              <Nav stepIdx={stepIdx} total={total} onBack={back} submitted={submitted} />
              <Progress value={progress} />
              {!submitted ? (
                <div className="step-content" key={stepIdx}>
                  <Header title={step.title} subtitle={step.subtitle} />
                  {step.type === "grid" && (
                    <GridStep step={step} selected={answers[step.id]} onPick={(v) => pick(step.id, v)} />
                  )}
                  {step.type === "form" && (
                    <FormStep
                      contact={contact} setContact={setContact}
                      touched={touched} setTouched={setTouched}
                      errs={errs} formValid={formValid} onSubmit={submit}
                    />
                  )}
                </div>
              ) : (
                <Success answers={answers} contact={contact} />
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────── components ───────────────────────────
    function ReviewBar() {
      return (
        <div className="review-bar">
          <div className="review-bar-inner">
            <div className="review-cluster">
              <div className="review-rating">
                <strong>4,3</strong>
                <Stars rating={4.3} />
              </div>
              <span className="review-divider" aria-hidden="true" />
              <div className="review-source">
                <span className="review-source-text">1.195+ Google-Bewertungen</span>
              </div>
            </div>
            <div className="review-trust"><Dot /> Kostenlos & unverbindlich</div>
          </div>
        </div>
      );
    }
    function GoogleG() {
      return (
        <svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
      );
    }
    function Stars({ rating }) {
      return (
        <span className="stars" aria-label={`${rating} von 5`}>
          {[0,1,2,3,4].map(i => {
            const fill = Math.max(0, Math.min(1, rating - i));
            return (
              <svg key={i} width="14" height="14" viewBox="0 0 20 20" aria-hidden="true">
                <defs>
                  <linearGradient id={`s-${i}-${rating}`}>
                    <stop offset={`${fill*100}%`} stopColor="currentColor" />
                    <stop offset={`${fill*100}%`} stopColor="currentColor" stopOpacity="0.25" />
                  </linearGradient>
                </defs>
                <path fill={`url(#s-${i}-${rating})`} d="M10 1.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L10 14.9l-5.25 2.75 1-5.85L1.5 7.65l5.9-.85L10 1.5z"/>
              </svg>
            );
          })}
        </span>
      );
    }
    const Dot = () => <span className="status-dot" aria-hidden="true" />;

    function closeFunnelToHost() {
      try { window.parent.postMessage({ type: 'funnel:close' }, '*'); } catch (e) {}
    }
    function Nav({ stepIdx, total, onBack, submitted }) {
      const stepNum = submitted ? total : stepIdx + 1;
      return (
        <>
          <div className="nav">
            <button className="back-btn" onClick={onBack} disabled={stepIdx === 0 || submitted} aria-label="Zurück">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
              <span>Zurück</span>
            </button>
            <div className="brand">
              <img src={LOGO_URI} alt="biller küchen" />
            </div>
            {/* Desktop: step counter on the right. Mobile: close button. */}
            <div className="step-counter">
              <span className="step-num">{stepNum}</span>
              <span className="step-sep">/</span>
              <span className="step-tot">{total}</span>
            </div>
            <button className="nav-close" onClick={closeFunnelToHost} aria-label="Schließen">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
              </svg>
            </button>
          </div>
          {/* Mobile: step pill pinned to the bottom-right of the viewport. */}
          <div className="step-pill" aria-hidden="true">{stepNum} / {total}</div>
        </>
      );
    }
    function BrandMark() {
      return (
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <rect x="2" y="2" width="18" height="18" rx="4" fill="var(--accent)" />
          <path d="M7 14V8h2.5l1.5 4 1.5-4H15v6" stroke="white" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function Progress({ value }) {
      return (
        <div className="progress">
          <span className="progress-track" />
          <span className="progress-fill" style={{ width: `${value}%` }} />
        </div>
      );
    }
    function Header({ title, subtitle }) {
      return (
        <div className="header">
          <h1 className="title">{title}</h1>
          {subtitle && <p className="subtitle">{subtitle}</p>}
        </div>
      );
    }

    function GridStep({ step, selected, onPick }) {
      return (
        <>
          <div className={`grid grid-cols-${step.cols}`} style={{"--cols": step.cols}}>
            {step.options.map((opt) => (
              <Card
                key={opt.id}
                selected={selected === opt.id}
                onSelect={() => onPick(opt.id)}
                label={opt.label} hint={opt.hint} glyph={opt.glyph}
              />
            ))}
          </div>
          {step.fallback && (
            <button
              type="button"
              className={`fallback ${selected === step.fallback.id ? "is-selected" : ""}`}
              onClick={() => onPick(step.fallback.id)}
            >
              <Plus /> {step.fallback.label}
            </button>
          )}
        </>
      );
    }
    function Plus() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
        </svg>
      );
    }
    function Card({ selected, onSelect, label, hint, glyph }) {
      return (
        <button
          type="button"
          className={`opt-card ${selected ? "is-selected" : ""}`}
          onClick={onSelect}
          aria-pressed={selected}
        >
          <span className="opt-check" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.5 6.5l2.2 2.2L9.5 3.8" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </span>
          <span className="opt-glyph"><Glyph name={glyph} label={label} /></span>
          <span className="opt-meta">
            <span className="opt-label">{label}</span>
            {hint && <span className="opt-hint">{hint}</span>}
          </span>
        </button>
      );
    }

    function FormStep({ contact, setContact, touched, setTouched, errs, formValid, onSubmit }) {
      const set = (k, v) => setContact((c) => ({ ...c, [k]: v }));
      const blur = (k) => setTouched((t) => ({ ...t, [k]: true }));
      const showErr = (k) => touched[k] && errs[k];
      return (
        <div className="form-step">
          {/* Anrede */}
          <div className="anrede" role="radiogroup" aria-label="Anrede">
            {ANREDE.map(a => (
              <button
                key={a.id} type="button" role="radio"
                aria-checked={contact.anrede === a.id}
                className={`anrede-opt ${contact.anrede === a.id ? "is-selected" : ""}`}
                onClick={() => set("anrede", a.id)}
              >{a.label}</button>
            ))}
          </div>

          <div className="form-grid">
            <label className={`field ${showErr("name") ? "has-error" : ""}`}>
              <span className="field-label">Vorname & Nachname*</span>
              <input className="input" type="text" autoComplete="name"
                value={contact.name} onChange={(e) => set("name", e.target.value)} onBlur={() => blur("name")}
                placeholder="Anna Müller" />
              {showErr("name") && <span className="field-err">{errs.name}</span>}
            </label>

            <label className={`field ${showErr("email") ? "has-error" : ""}`}>
              <span className="field-label">E-Mail-Adresse*</span>
              <input className="input" type="email" autoComplete="email"
                value={contact.email} onChange={(e) => set("email", e.target.value)} onBlur={() => blur("email")}
                placeholder="anna@beispiel.de" />
              {showErr("email") && <span className="field-err">{errs.email}</span>}
            </label>

            <label className={`field ${showErr("phone") ? "has-error" : ""}`}>
              <span className="field-label">Telefonnummer*</span>
              <div className="phone-row">
                <select className="phone-country" value={contact.phoneCountry}
                  onChange={(e) => set("phoneCountry", e.target.value)}>
                  {COUNTRIES.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
                </select>
                <input className="input" type="tel" autoComplete="tel"
                  value={contact.phone} onChange={(e) => set("phone", e.target.value)} onBlur={() => blur("phone")}
                  placeholder="151 234 5678" />
              </div>
              {showErr("phone") && <span className="field-err">{errs.phone}</span>}
            </label>

            <label className={`field ${showErr("plz") ? "has-error" : ""}`}>
              <span className="field-label">Postleitzahl*</span>
              <input className="input" type="text" autoComplete="postal-code" inputMode="numeric"
                value={contact.plz} onChange={(e) => set("plz", e.target.value)} onBlur={() => blur("plz")}
                placeholder="10115" />
              {showErr("plz") && <span className="field-err">{errs.plz}</span>}
            </label>
          </div>

          <div className="cta-row">
            <button type="button" className="form-cta" disabled={!formValid} onClick={onSubmit}>
              <Lock /> Gratis Termin anfragen
            </button>
            <span className="ssl-pill"><Lock small /> SSL-verschlüsselt</span>
            <p className="legal">
              Mit Klick auf den Button akzeptieren Sie unsere <a href="#" onClick={(e) => e.preventDefault()}>AGB</a>. Ihre Angaben werden zur Erbringung unserer Leistungen genutzt — wir kontaktieren Sie per E-Mail, Telefon oder Kurznachricht, um Ihr Angebot zu finalisieren. Daten werden nicht an Dritte weitergegeben. Mehr in der <a href="#" onClick={(e) => e.preventDefault()}>Datenschutzerklärung</a>.
            </p>
          </div>
        </div>
      );
    }
    function Lock({ small }) {
      const s = small ? 12 : 16;
      return (
        <svg width={s} height={s} viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="3" y="7" width="10" height="7" rx="1.6" stroke="currentColor" strokeWidth="1.4" />
          <path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" strokeWidth="1.4" />
        </svg>
      );
    }

    function Success({ answers, contact }) {
      return (
        <div className="success">
          <div className="success-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="19" stroke="var(--accent)" strokeWidth="1.5" />
              <path d="M12 20.5l5 5L29 14" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <h2 className="success-title">Vielen Dank, {contact.name.split(" ")[0] || "Sie"}!</h2>
          <p className="success-sub">
            Wir bereiten Ihren persönlichen Vorschlag vor und melden uns innerhalb von 24 Stunden unter <strong>{contact.email}</strong>.
          </p>
          <div className="success-summary">
            <div><span>Form</span><strong>{labelOf("shape", answers.shape)}</strong></div>
            <div><span>Termin</span><strong>{labelOf("location", answers.location) || "—"}</strong></div>
            <div><span>Zeitraum</span><strong>{labelOf("timing", answers.timing) || "—"}</strong></div>
            <div><span>Budget</span><strong>{labelOf("budget", answers.budget) || "—"}</strong></div>
          </div>
        </div>
      );
    }
    function labelOf(stepId, valueId) {
      const step = STEPS.find(s => s.id === stepId);
      if (!step?.options) return null;
      const opt = step.options.find(o => o.id === valueId) || (step.fallback?.id === valueId ? step.fallback : null);
      return opt?.label || null;
    }

    function Reassurance() {
      const items = [
        { t: "100% kostenlos", s: "Keine versteckten Gebühren" },
        { t: "Unverbindlich",  s: "Kein Kaufzwang, jederzeit kündbar" },
        { t: "DSGVO-konform",  s: "Daten bleiben bei uns" },
      ];
      return (
        <div className="reassure">
          {items.map((i, idx) => (
            <div key={idx} className="reassure-item">
              <span className="reassure-icon"><Check /></span>
              <div>
                <div className="reassure-t">{i.t}</div>
                <div className="reassure-s">{i.s}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }
    function Check() {
      return (
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M4.5 9.2l3 3 6-7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function BrandStrip() {
      return (
        <div className="brand-strip">
          <span className="brand-strip-label">Wir planen mit</span>
          <div className="brand-list">
            {BRANDS.map(b => <span key={b} className="brand-item">{b}</span>)}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
