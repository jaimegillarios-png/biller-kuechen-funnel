<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>biller küchen · Küchenplaner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #F2F4F7;
      --bg-2: #E5E8EC;
      --paper: #FFFFFF;
      --paper-2: #FFFFFF;
      --ink: #2B3136;
      --ink-2: #4B5159;
      --ink-3: #707681;
      --ink-4: #A8ADB5;
      --line: rgba(43, 49, 54, 0.10);
      --line-2: rgba(43, 49, 54, 0.16);
      --accent: #781e39;
      --accent-soft: #F7EDF0;
      --radius: 14px;
      --shadow-card: 0 1px 0 rgba(26,29,27,0.04), 0 12px 40px -16px rgba(26,29,27,0.12);
      --t: 220ms cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ink);
      background: var(--bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-feature-settings: "ss01", "cv11";
    }
    button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
    input, select { font-family: inherit; color: inherit; }
    a { color: var(--ink-2); }

    .page {
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px;
      background:
        radial-gradient(1200px 600px at 50% 20%, rgba(26,29,27,0.10), transparent 60%),
        rgba(26, 29, 27, 0.55);
      backdrop-filter: blur(2px);
    }
    /* When embedded inside another page (v10 modal), let the parent handle the
       backdrop — drop our own dim layer so the modal sits cleanly on the host. */
    html.embedded, html.embedded body, html.embedded #root { height: 100%; overflow: hidden; margin: 0; }
    /* Standalone-iframed: keep the centered-card layout but drop our own
       backdrop so the host's overlay shows through. */
    html.iframed-standalone, html.iframed-standalone body, html.iframed-standalone #root { margin: 0; background: transparent !important; }
    html.iframed-standalone .page {
      background: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }
    /* Desktop: anchor the iframed funnel near the top of the viewport
       instead of vertically centering it. */
    @media (min-width: 880px) {
      html.iframed-standalone .page {
        justify-content: flex-start;
        padding-top: 8vh;
      }
    }
    .embedded .page {
      padding: 0;
      background: transparent;
      backdrop-filter: none;
      justify-content: flex-start;
      align-items: stretch;
      min-height: 0;
      height: 100%;
      max-height: 100%;
      overflow: hidden;
    }
    .embedded .card {
      max-width: none;
      flex: 1 1 100%;
      min-height: 0;
      max-height: 100%;
      border-radius: 0;
      border: 0;
      box-shadow: none;
      display: flex; flex-direction: column;
      overflow: hidden;
    }
    .embedded .card-body {
      flex: 1 1 0;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .embedded .card-body::-webkit-scrollbar { width: 8px; }
    .embedded .card-body::-webkit-scrollbar-thumb { background: rgba(43,49,54,0.18); border-radius: 4px; }
    .embedded .card-body::-webkit-scrollbar-thumb:hover { background: rgba(43,49,54,0.28); }

    .card {
      width: 100%;
      max-width: 850px;
      background: var(--paper);
      border-radius: 20px;
      border: 1px solid rgba(0,0,0,0.35);
      box-shadow: 0 30px 80px -20px rgba(0,0,0,0.45);
      overflow: hidden;
      position: relative;
    }
    .card-body {
      padding: 10px 36px 36px;
      min-height: 600px;
      display: flex; flex-direction: column;
    }

    /* review bar — slim banner inside modal */
    /* variant=B → No trust bar (and balance card padding on all sides) */
    html.variant-B .review-bar { display: none; }
    html.variant-B .card-body { padding: 32px; }
    @media (max-width: 880px) {
      html.variant-B .card-body { padding: 24px; }
    }
    /* variant=C → "Compact": very light grey body so the white option
       cards stand out more clearly against the background. */
    html.variant-C .card-body { background: #F8F8F9; }

    /* ─────────────────────────────────────────────────────────────
       variant=H → Branded twin of A. Same Modern + CRO stack, but
       restores the biller küchen logo and swaps the charcoal accent
       for burgundy (#781e39) across every CTA / selected state.
       ───────────────────────────────────────────────────────────── */
    html.variant-H.variant-E .brand img {
      content: normal;          /* revert variant-E logo override */
      height: 48px; width: auto;
    }
    @media (max-width: 600px) {
      html.variant-H.variant-E .brand img { height: 40px; }
    }
    /* Accent swaps */
    html.variant-H.variant-E .opt-card.is-selected {
      border-color: #781e39;
      box-shadow:
        0 0 0 1px #781e39,
        0 14px 32px -16px rgba(120,30,57,0.30);
    }
    html.variant-H.variant-E .opt-card.is-just-selected .opt-check,
    html.variant-H.variant-E .opt-card.is-selected .opt-check {
      background: #781e39; border-color: #781e39;
    }
    html.variant-H.variant-E .progress-fill {
      background: linear-gradient(90deg, #781e39, #a83557);
    }
    html.variant-H.variant-E .step-counter .step-num { color: #781e39; }
    html.variant-H.variant-E .anrede-opt.is-selected {
      background: #781e39; border-color: #781e39; color: #FFFFFF;
    }
    html.variant-H.variant-E .input:focus,
    html.variant-H.variant-E .phone-country:focus {
      border-color: #781e39;
      box-shadow: 0 0 0 4px rgba(120,30,57,0.10);
    }
    html.variant-H.variant-E .field.is-valid .input { border-color: #781e39; }
    html.variant-H.variant-E .field.is-valid .valid-check { background: #781e39; }
    html.variant-H.variant-E .form-cta {
      background: linear-gradient(180deg, #8c2243, #5c1228);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.06) inset,
        0 10px 22px -10px rgba(120,30,57,0.55);
    }
    html.variant-H.variant-E .form-cta:hover:not(:disabled) {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 14px 28px -12px rgba(120,30,57,0.60);
    }
    html.variant-H.variant-E .fallback.is-selected {
      border-color: #781e39; background: #781e39; color: #FFFFFF;
    }

    /* ─────────────────────────────────────────────────────────────
       variant=I → Möbel Martin branded twin. Replaces the brand img
       with the MM logo and swaps the accent to MM brand red (#e30613).
       ───────────────────────────────────────────────────────────── */
    html.variant-I.variant-E .brand img {
      content: url("./assets/moebel-martin-logo.svg");
      height: 40px; width: auto;
    }
    @media (max-width: 600px) {
      html.variant-I.variant-E .brand img { height: 32px; }
    }
    html.variant-I.variant-E .opt-card.is-selected {
      border-color: #e30613;
      box-shadow:
        0 0 0 1px #e30613,
        0 14px 32px -16px rgba(227,6,19,0.30);
    }
    html.variant-I.variant-E .opt-card.is-just-selected .opt-check,
    html.variant-I.variant-E .opt-card.is-selected .opt-check {
      background: #e30613; border-color: #e30613;
    }
    html.variant-I.variant-E .progress-fill {
      background: linear-gradient(90deg, #e30613, #b8050f);
    }
    html.variant-I.variant-E .step-counter .step-num { color: #e30613; }
    html.variant-I.variant-E .anrede-opt.is-selected {
      background: #e30613; border-color: #e30613; color: #FFFFFF;
    }
    html.variant-I.variant-E .input:focus,
    html.variant-I.variant-E .phone-country:focus {
      border-color: #e30613;
      box-shadow: 0 0 0 4px rgba(227,6,19,0.10);
    }
    html.variant-I.variant-E .field.is-valid .input { border-color: #e30613; }
    html.variant-I.variant-E .field.is-valid .valid-check { background: #e30613; }
    html.variant-I.variant-E .form-cta {
      background: linear-gradient(180deg, #ef1a26, #b8050f);
      box-shadow:
        0 1px 0 rgba(255,255,255,0.06) inset,
        0 10px 22px -10px rgba(227,6,19,0.55);
    }
    html.variant-I.variant-E .form-cta:hover:not(:disabled) {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.08) inset,
        0 14px 28px -12px rgba(227,6,19,0.60);
    }
    html.variant-I.variant-E .fallback.is-selected {
      border-color: #e30613; background: #e30613; color: #FFFFFF;
    }

    /* ─────────────────────────────────────────────────────────────
       variant=G → 4-second white intro splash before the funnel.
       Logo + animated dots + tagline. Slides up out of frame.
       ───────────────────────────────────────────────────────────── */
    .splash {
      position: absolute; inset: 0;
      z-index: 30;
      background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      border-radius: inherit;
      overflow: hidden;
    }
    .splash--visible { opacity: 1; }
    .splash--leaving { animation: vG-splash-out 420ms cubic-bezier(.5, 0, .2, 1) both; }
    @keyframes vG-splash-out {
      from { transform: translateX(0);     opacity: 1; }
      to   { transform: translateX(-100%); opacity: 1; }
    }
    .splash__stage {
      display: flex; flex-direction: column; align-items: center;
      gap: 28px;
      width: 100%;
      max-width: 380px;
      padding: 0 24px;
    }
    /* USP carousel — each USP re-mounts with React key change, sliding in
       from the right while the old one's removal is instant (clean fade). */
    .splash__usp {
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      text-align: center;
      animation: vG-usp-slide 1600ms cubic-bezier(.45, 0, .25, 1) both;
      min-height: 100px;
      justify-content: center;
    }
    @keyframes vG-usp-slide {
      0%   { opacity: 0; transform: translateX(56px) scale(.985); }
      22%  { opacity: 1; transform: translateX(0)    scale(1); }
      62%  { opacity: 1; transform: translateX(0)    scale(1); }
      100% { opacity: 0; transform: translateX(-56px) scale(.985); }
    }
    .splash__icon {
      color: #1A1D1B;
      display: flex; align-items: center; justify-content: center;
    }
    .splash__label {
      margin: 0;
      font-size: 15px; font-weight: 500;
      letter-spacing: -0.012em;
      color: #1A1D1B;
      line-height: 1.3;
    }
    /* Loading bar */
    .splash__bar {
      width: 100%;
      max-width: 140px;
      height: 3px;
      border-radius: 999px;
      background: rgba(15,17,16,0.08);
      overflow: hidden;
    }
    .splash__bar-fill {
      height: 100%; width: 0;
      background: #1A1D1B;
      border-radius: 999px;
      animation: vG-bar 4300ms linear both;
    }
    @keyframes vG-bar {
      from { width: 0; }
      to   { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .splash--leaving, .splash__usp, .splash__bar-fill { animation: none !important; }
    }

    /* ─────────────────────────────────────────────────────────────
       Exit-intent overlay (variant-F and above). Covers the entire
       card with the same white surface, centered content.
       ───────────────────────────────────────────────────────────── */
    .exit-overlay {
      position: absolute; inset: 0;
      z-index: 40;
      background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      padding: 48px 40px;
      border-radius: inherit;
      animation: vF-exit-in 260ms cubic-bezier(.2,.8,.2,1) both;
    }
    @keyframes vF-exit-in {
      from { opacity: 0; transform: scale(.985); }
      to   { opacity: 1; transform: scale(1); }
    }
    .exit-overlay__inner {
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
      text-align: center;
      max-width: 460px;
    }
    .exit-overlay__icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: rgba(15,17,16,0.05);
      color: #1A1D1B;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .exit-overlay__art {
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 4px;
    }
    .exit-overlay__art .exit-art__plane {
      transform-origin: 106px 30px;
      animation: vF-plane-glide 2.8s ease-in-out infinite;
    }
    @keyframes vF-plane-glide {
      0%, 100% { transform: translate(0, 0)    rotate(0deg); }
      50%      { transform: translate(2px,-3px) rotate(-3deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .exit-overlay__art .exit-art__plane { animation: none; }
    }
    .exit-overlay__title {
      margin: 0;
      font-size: 26px; font-weight: 600;
      letter-spacing: -0.025em; line-height: 1.15;
      color: #1A1D1B;
      text-wrap: balance;
    }
    .exit-overlay__sub {
      margin: 0;
      font-size: 14.5px;
      color: rgba(26,29,27,0.55);
      line-height: 1.5;
      max-width: 380px;
      text-wrap: pretty;
    }
    .exit-overlay__primary {
      width: auto !important;
      min-width: 220px;
      margin-top: 8px;
    }
    .exit-overlay__leave {
      background: transparent;
      border: 0;
      padding: 6px 10px;
      color: rgba(26,29,27,0.62);
      font-size: 13.5px; font-weight: 500;
      text-decoration: underline; text-underline-offset: 3px;
      cursor: pointer;
      transition: color 160ms ease;
    }
    .exit-overlay__leave:hover { color: #1A1D1B; }
    @media (max-width: 600px) {
      .exit-overlay { padding: 32px 24px; }
      .exit-overlay__title { font-size: 22px; }
    }


    /* ─────────────────────────────────────────────────────────────
       variant=F → CRO additions on top of Modern (variant-E):
       "Beliebt" badge on the most-chosen option per step,
       and a small reassurance hint under the email field.
       The badge / hint nodes render in all variants but are hidden
       by default; variant-F reveals them.
       ───────────────────────────────────────────────────────────── */
    .opt-badge { display: none; }
    .field-hint { display: none; }
    html.variant-F .opt-card { padding-top: 18px; }
    html.variant-F .opt-badge {
      display: inline-flex; align-items: center;
      position: absolute; top: -9px; left: 50%;
      transform: translateX(-50%);
      padding: 3px 10px;
      border-radius: 999px;
      background: #F5B400;
      color: #5A3D00;
      font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase;
      box-shadow: 0 2px 6px -2px rgba(245,180,0,0.55);
      white-space: nowrap;
      z-index: 3;
    }
    html.variant-F .opt-card.is-popular {
      border-color: rgba(245,180,0,0.45);
    }
    html.variant-F .opt-card.is-popular:hover {
      border-color: rgba(245,180,0,0.70);
    }
    html.variant-F .field-hint {
      display: block;
      font-size: 11.5px;
      color: rgba(26,29,27,0.55);
      line-height: 1.35;
      margin-top: 2px;
    }

    /* Time-left chip (variant-F only — visible by default hidden when no prop). */
    .time-left { display: none; }
    html.variant-F .time-left {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      margin: 0 auto 12px;
      border-radius: 999px;
      background: rgba(22,163,74,0.08);
      border: 1px solid rgba(22,163,74,0.18);
      color: #166534;
      font-size: 11.5px; font-weight: 500;
      font-variant-numeric: tabular-nums;
    }
    html.variant-F .header { display: flex; flex-direction: column; align-items: center; }

    /* Consultant block above contact form */
    .consultant { display: none; }
    html.variant-F .consultant {
      display: flex; align-items: center; justify-content: flex-start;
      gap: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, #FFFFFF, #FAFAF8);
      border: 1px solid rgba(15,17,16,0.07);
      box-shadow: 0 1px 0 rgba(255,255,255,0.6) inset,
                  0 1px 2px rgba(15,17,16,0.03);
      margin-top: -4px;
      margin-bottom: 6px;
    }
    html.variant-F .consultant__avatar {
      display: inline-flex; align-items: center; justify-content: center;
      width: 38px; height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, #F5B400, #E27A1F);
      color: #FFFFFF;
      font-size: 13px; font-weight: 700;
      letter-spacing: 0.02em;
      flex-shrink: 0;
    }
    html.variant-F .consultant__avatar--img {
      width: 96px; height: auto;
      border-radius: 0;
      background: transparent;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
    }
    html.variant-F .consultant__meta {
      display: flex; flex-direction: column; gap: 2px;
      text-align: left;
    }
    html.variant-F .consultant__name {
      font-size: 14px; font-weight: 600; color: #1A1D1B;
      letter-spacing: -0.01em;
      line-height: 1.2;
    }
    html.variant-F .consultant__role {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12.5px; color: rgba(26,29,27,0.62);
      line-height: 1.3;
    }
    /* Tiny green status dot before the role for "available now" vibe */
    html.variant-F .consultant__role::before {
      content: "";
      width: 6px; height: 6px; border-radius: 50%;
      background: #16A34A;
      box-shadow: 0 0 0 2px rgba(22,163,74,0.18);
      flex-shrink: 0;
    }

    /* Inline validation checkmarks (variant-F only) */
    .valid-check { display: none; }
    html.variant-F .input-wrap { position: relative; }
    html.variant-F .field.is-valid .valid-check {
      display: inline-flex; align-items: center; justify-content: center;
      position: absolute; right: 12px; top: 50%;
      transform: translateY(-50%);
      width: 20px; height: 20px;
      border-radius: 50%;
      background: #16A34A;
      color: #FFFFFF;
      animation: vF-check-pop 240ms cubic-bezier(.2,1.6,.4,1);
    }
    html.variant-F .field.is-valid .input { border-color: rgba(22,163,74,0.45); padding-right: 38px; }
    @keyframes vF-check-pop {
      from { transform: translateY(-50%) scale(.4); opacity: 0; }
      to   { transform: translateY(-50%) scale(1);  opacity: 1; }
    }

    /* Microreward: subtle bounce — only on real selection, not back-nav. */
    html.variant-F .opt-card.is-just-selected .opt-check {
      animation: vF-check-bounce 520ms cubic-bezier(.34, 1.4, .64, 1) both;
    }
    @keyframes vF-check-bounce {
      0%   { transform: scale(0);    opacity: 0; }
      55%  { transform: scale(1.18); opacity: 1; }
      80%  { transform: scale(.96); }
      100% { transform: scale(1);    opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      html.variant-F .opt-card.is-just-selected .opt-check { animation: none; }
    }

    /* Linger tooltip below email */
    .linger-tip { display: none; }
    html.variant-F .linger-tip {
      display: block;
      margin-top: 6px;
      padding: 8px 10px;
      border-radius: 8px;
      background: rgba(245,180,0,0.10);
      border: 1px solid rgba(245,180,0,0.30);
      color: #6B4A00;
      font-size: 12px; line-height: 1.4;
      animation: vF-fade-in 280ms ease-out;
    }
    @keyframes vF-fade-in {
      from { opacity: 0; transform: translateY(-4px); }
      to   { opacity: 1; transform: translateY(0); }
    }


    /* ─────────────────────────────────────────────────────────────
       variant=E → "Modern": a more refined, product-designer pass.
       Hairline borders, segmented progress, monochrome trust bar,
       sharper typography, gradient CTA. Same icons & flow.
       ───────────────────────────────────────────────────────────── */
    html.variant-E { --accent: #1A1D1B; --accent-soft: #F1F2F1; }
    html.variant-E body { background: #F2F3F2; }
    html.variant-E .card {
      border-radius: 24px;
      border: 1px solid rgba(15, 17, 16, 0.08);
      box-shadow:
        0 1px 2px rgba(15,17,16,0.02),
        0 6px 16px -10px rgba(15,17,16,0.05),
        0 24px 48px -28px rgba(15,17,16,0.08);
    }
    html.variant-E .card-body {
      background: #F8F8F9;
      padding: 14px 40px 40px;
    }
    @media (max-width: 880px) {
      html.variant-E .card-body { padding: 20px 20px 28px; }
      html.variant-E .card {
        border-radius: 0;
        border-left: 0; border-right: 0;
        max-width: none; width: 100%;
      }
    }

    /* Review bar: light glass on desktop, dark grey on mobile */
    html.variant-E .review-bar {
      background: #FAFBFA;
      color: #1A1D1B;
      border-bottom: 1px solid rgba(15,17,16,0.06);
      font-size: 12px;
      letter-spacing: 0;
    }
    html.variant-E .review-bar-inner { padding: 10px 40px; min-height: 40px; gap: 14px; }
    html.variant-E .review-divider { background: rgba(15,17,16,0.10); height: 14px; }
    html.variant-E .review-rating strong { font-weight: 600; color: #1A1D1B; font-size: 14px; }
    html.variant-E .stars { color: #F5B400; }
    html.variant-E .stars svg { width: 14px; height: 14px; }
    html.variant-E .review-source { color: rgba(26,29,27,0.62); }
    html.variant-E .review-trust { color: rgba(26,29,27,0.72); }

    @media (max-width: 880px) {
      html.variant-E .review-bar {
        background: #1F2326;
        color: #FFFFFF;
        border-bottom-color: rgba(255,255,255,0.06);
      }
      html.variant-E .review-bar-inner {
        padding: 10px 16px;
        justify-content: center;
        flex-wrap: wrap;
      }

    .review-bar {

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 4px oklch(70% 0.15 150 / 0.18); }
      50%      { box-shadow: 0 0 0 6px oklch(70% 0.15 150 / 0.10); }

    /* nav */
    .nav {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 0 0 10px;
    }
    .nav > * { align-self: center; line-height: 1; }
    .nav .back-btn { justify-self: start; }
    .nav .brand    { justify-self: center; }
    .nav .step-counter { justify-self: end; }
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 14px; color: var(--ink-2);
      padding: 8px 12px; margin-left: 0;
      border-radius: 10px;
      transition: var(--t);
    }
    .back-btn svg { width: 16px; height: 16px; }
    .back-btn:hover:not(:disabled) { background: var(--bg-2); color: var(--ink); }
    .back-btn:disabled { opacity: 0; pointer-events: none; }
    .brand { display: inline-flex; align-items: center; }
    .brand img { display: block; height: 48px; width: auto; }
    .step-counter {
      font-variant-numeric: tabular-nums;
      font-size: 13px; color: var(--ink-3); letter-spacing: 0.04em;
    }
    .step-counter .step-num { color: var(--ink); font-weight: 600; }
    .step-counter .step-sep { margin: 0 2px; color: var(--ink-4); }
    /* Mobile-only: close button (in nav, where step counter sat) and a
       fixed step pill pinned to the bottom-right of the viewport. */
    .nav .nav-close {
      justify-self: end;
      display: none;
      width: 32px; height: 32px;
      align-items: center; justify-content: center;
      border-radius: 999px;
      color: var(--ink-2);
      background: transparent;
      border: 0;
      transition: var(--t);
    }
    .nav .nav-close:hover { background: var(--bg-2); color: var(--ink); }
    .step-pill { display: none; }

    /* progress */
    .progress {
      position: relative; width: 100%; height: 2px;
      margin-bottom: 32px; border-radius: 2px; overflow: hidden;
    }
    .progress-track { position: absolute; inset: 0; background: var(--line); }
    .progress-fill {
      position: absolute; inset: 0 auto 0 0;
      background: var(--accent);
      border-radius: 2px;
      transition: width 480ms cubic-bezier(.2,.7,.2,1);
    }

    /* step */
    .step-content { flex: 1; display: flex; flex-direction: column; animation: fadeUp 320ms cubic-bezier(.2,.7,.2,1); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* Slide stage — holds outgoing + incoming step during step transitions.
       Uses a single-cell grid so both children stack on top of each other
       and the cell sizes to the taller child — no vertical jump as one
       step replaces another with different content height. */
    .step-stage {
      position: relative;
      flex: 1;
      display: grid;
      grid-template-areas: "slot";
      align-items: stretch;
      overflow: hidden;
      padding: 6px;
      margin: -6px;
    }
    .step-stage .step-content--in,
    .step-stage .step-content--out {
      grid-area: slot;
      min-width: 0;
      animation: none; /* override base fadeUp; we'll drive via stage classes */
    }
    .step-stage .step-content--out { pointer-events: none; }
    .step-stage--forward .step-content--in  { animation: vF-slide-in-right 600ms cubic-bezier(.2,.8,.2,1) both; }
    .step-stage--forward .step-content--out { animation: vF-slide-out-left 600ms cubic-bezier(.2,.8,.2,1) both; }
    .step-stage--back    .step-content--in  { animation: vF-slide-in-left 600ms cubic-bezier(.2,.8,.2,1) both; }
    .step-stage--back    .step-content--out { animation: vF-slide-out-right 600ms cubic-bezier(.2,.8,.2,1) both; }
    @keyframes vF-slide-in-right {
      from { opacity: 0; transform: translateX(48px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes vF-slide-out-left {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(-48px); }
    }
    @keyframes vF-slide-in-left {
      from { opacity: 0; transform: translateX(-48px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes vF-slide-out-right {
      from { opacity: 1; transform: translateX(0); }
      to   { opacity: 0; transform: translateX(48px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .step-stage .step-content--in,
      .step-stage .step-content--out { animation: none; }
    }

    .header { margin-bottom: 32px; text-align: center; }
    .title {
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 24px; line-height: 1.18;
      letter-spacing: -0.02em; margin: 0 0 14px;
      color: var(--ink); text-wrap: balance;
    }
    .subtitle { margin: 0; font-size: 14px; color: var(--ink-3); text-wrap: pretty; }

    /* grid */
    .grid {
      display: grid;
      gap: 12px;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
    }
    .grid-cols-2 { --cols: 2; max-width: 600px; margin: 0 auto; width: 100%; }
    .grid-cols-3 { --cols: 3; }
    .grid-cols-4 { --cols: 4; }
    .grid-cols-5 { --cols: 5; }

    .opt-card {
      position: relative;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px;
      padding: 10px 10px 12px;
      background: var(--paper-2);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      text-align: center;
      transition: transform var(--t), border-color var(--t), box-shadow var(--t), background var(--t);
      isolation: isolate;
    }
    .opt-card:hover {
      border-color: var(--line-2);
      transform: translateY(-2px);
      box-shadow: 0 10px 28px -10px rgba(26,29,27,0.14);
    }
    .opt-card.is-selected {
      border-color: var(--accent);
      background: var(--paper-2);
      box-shadow: 0 0 0 3px var(--accent-soft), 0 14px 32px -14px rgba(120, 30, 57, 0.40);
    }
    .opt-glyph {
      display: block; width: 100%;
      max-width: 150px;
      margin: 0 auto;
      border-radius: 8px;
      background: #ffffff;
      color: var(--ink);
      overflow: hidden;
      aspect-ratio: 4/3;
      padding: 0; position: relative;
    }
    .opt-glyph .shape-svg { display: block; width: 100%; height: 100%; }
    .opt-glyph .iso-stage { padding: 6px; }

    /* File-based Glyph component. Each glyph file keeps its own native
       proportions; per-category padding gives every option card a
       consistent visual footprint without distorting the artwork. */
    .opt-glyph .glyph {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 10px;
    }
    .opt-glyph .glyph > svg {
      display: block;
      width: 100%; height: 100%;
      max-width: 100%; max-height: 100%;
    }
    /* Location glyphs now share the 80×60 viewBox of the other categories
       — they render at the same scale, no extra inset needed. */
    .opt-glyph .opt-bitmap {
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%;
      padding: 22px;
    }
    .opt-glyph .opt-bitmap > svg {
      display: block;
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
    }
    /* Thicken the line work in the supplied SVGs. The icon files draw
       outlines as thin filled shapes (.cls-1) with stroke-width:0; layering
       a stroke on top widens the perceived line. */
    .opt-glyph .opt-bitmap > svg .cls-1 {
      stroke: #3F4644;
      stroke-width: 1.15;
      stroke-linejoin: round;
      stroke-linecap: round;
      fill: #3F4644;
    }
    /* Unify icon line color across all glyph variants — inline iso SVGs,
       supplied SVG files, and budget illustrations. Targets every common
       way "black" is encoded in the source markup. */
    .opt-glyph svg [fill="black"],
    .opt-glyph svg [fill="#000"],
    .opt-glyph svg [fill="#000000"],
    .opt-glyph svg [fill="#1A1D1B"],
    .opt-glyph svg [fill="#1a1d1b"] {
      fill: #3F4644;
    }
    .opt-glyph svg [stroke="black"],
    .opt-glyph svg [stroke="#000"],
    .opt-glyph svg [stroke="#000000"],
    .opt-glyph svg [stroke="#1A1D1B"],
    .opt-glyph svg [stroke="#1a1d1b"] {
      stroke: #3F4644;
    }
    .opt-meta { display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; width: 100%; }
    .opt-label { display: block; font-size: 14px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); }
    .opt-hint { display: block; font-size: 12px; color: var(--ink-3); }

    .opt-check {
      position: absolute;
      top: 8px; right: 8px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: var(--ink-4);
      border: 1.5px solid transparent;

      opacity: 0; transform: scale(.6); transition: var(--t);
      z-index: 2;

    /* form */
    .form-step { display: flex; flex-direction: column; gap: 14px; max-width: 440px; margin: 0 auto; width: 100%; }
    .anrede {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;

    .anrede-opt {
      padding: 8px 10px; border-radius: 999px;

      border-color: var(--accent); background: var(--accent-soft); color: var(--ink);

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; grid-column: 1 / -1; }
    .field-half { grid-column: span 1; }

    .input {

    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .phone-row { display: grid; grid-template-columns: 120px 1fr; gap: 8px; align-items: stretch; }
    .phone-country {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px; border: 1.5px solid var(--line);
      background: var(--paper-2); font-size: 14px; color: var(--ink);
      outline: none; transition: var(--t);
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='%236E726F' d='M0 0h10L5 6z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
      padding-right: 28px;
    }
    .phone-country:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }

    .form-cta {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 13px 20px;
      background: var(--ink); color: var(--paper);
      border-radius: 12px;
      font-size: 14px; font-weight: 500;

    .ssl-pill {
      display: inline-flex; align-items: center; gap: 6px;
      align-self: center;
      padding: 6px 12px;
      border-radius: 999px;

      letter-spacing: 0.08em;
      color: var(--ink-3);

    .legal {

    /* CTA row (form only) */
    .cta-row {
      margin-top: 8px;
      display: flex; flex-direction: column; gap: 10px; align-items: stretch;
    }

    /* success */
    .success {
      display: flex; flex-direction: column; align-items: center; text-align: center;
      padding: 24px 0;
      animation: fadeUp 360ms cubic-bezier(.2,.7,.2,1);
    }
    .success-icon {
      margin-bottom: 18px; background: var(--accent-soft);
      width: 72px; height: 72px; border-radius: 50%;
      display: grid; place-items: center;
    }
    .success-title { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 30px; letter-spacing: -0.02em; margin: 0 0 8px; }
    .success-sub { margin: 0 0 32px; color: var(--ink-3); max-width: 480px; }
    .success-summary {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
      width: 100%; max-width: 640px;
    }
    .success-summary > div {
      padding: 14px; border-radius: 12px; background: var(--bg-2);
      display: flex; flex-direction: column; gap: 4px; text-align: left;
    }
    .success-summary span { font-size: 12px; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.06em; }
    .success-summary strong { font-size: 14px; font-weight: 600; color: var(--ink); }

    /* brand strip */
    .brand-strip {
      border-top: 1px solid var(--line);
      padding: 12px 60px;
      display: flex; align-items: center; gap: 24px;
      background: var(--paper);
    }
    .brand-strip-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--ink-4); white-space: nowrap; }
    .brand-list { flex: 1; display: flex; align-items: center; justify-content: space-around; gap: 18px; flex-wrap: wrap; }
    .brand-item {
      font-family: 'Inter', sans-serif;
      font-weight: 500; font-size: 14px; letter-spacing: 0.04em;
      color: var(--ink-3); opacity: 0.85;
      transition: var(--t);
    }

    /* reassurance strip — sits flush at the bottom of the card */
    .reassure {
      margin: 0;
      width: 100%;
      display: grid; grid-template-columns: repeat(3, 1fr);
      background: transparent;
      border: 0;
      border-top: 1px solid var(--line);
      border-radius: 0;
      padding: 0 36px;
      box-shadow: none;
    }
    .reassure-item {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      padding: 16px 18px;
      transition: background var(--t);
      border-radius: 14px;
    }
    .reassure-item:not(:last-child)::after {
      content: "";
      position: absolute; right: 0; top: 22%; bottom: 22%;
      width: 1px; background: var(--line);
    }
    .reassure-icon {
      flex-shrink: 0;
      width: 30px; height: 30px;
      border-radius: 50%;
      display: grid; place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
    }
    .reassure-t {
      font-size: 13px; font-weight: 600; color: var(--ink);
      letter-spacing: -0.01em;
    }
    .reassure-s { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

    /* responsive */
    @media (max-width: 1100px) {
      .card-body { padding: 20px 36px 28px; }
    }
    @media (max-width: 880px) {
      .page {
        padding: 0;
        background: var(--bg);
        backdrop-filter: none;
        justify-content: flex-start;
        align-items: stretch;
      }
      html.iframed-standalone .page { background: transparent; }
      .card {
        border-radius: 0;
        border: 0;
        box-shadow: none;
        max-width: none;
      }
      .card-body { padding: 12px 16px 16px; min-height: calc(100vh - 60px); }
      .nav { padding: 4px 0 10px; }
      /* Swap step counter for the close button in the nav */
      .nav .step-counter { display: none; }
      .nav .nav-close { display: inline-flex; width: 40px; height: 40px; }
      .nav .nav-close svg { width: 18px; height: 18px; }
      /* Bigger back-button touch target on mobile */
      .nav .back-btn { font-size: 15px; padding: 10px 14px; gap: 8px; }
      .nav .back-btn svg { width: 20px; height: 20px; }
      /* Step counter becomes a fixed pill anchored bottom-right */
      .step-pill {
        display: inline-block;
        position: fixed;
        right: 12px;
        bottom: 12px;
        padding: 6px 12px;
        background: rgba(20,17,15,0.85);
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        font-variant-numeric: tabular-nums;
        border-radius: 999px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        z-index: 60;
        pointer-events: none;
      }
      .progress { margin-bottom: 32px; }
      .header { margin-bottom: 36px; }
      .title { margin-bottom: 14px; }
      .grid { gap: 10px; }
      .fallback { margin-top: 12px; }
      .reassure {
        margin: 0; max-width: none;
        border-radius: 0;
        border-left: 0; border-right: 0;
        box-shadow: none;
        padding: 0 18px;
      }
      .reassure-item { justify-content: flex-start; padding: 22px 6px; gap: 10px; }
      .grid-cols-5 { grid-template-columns: repeat(2, 1fr); }
      .grid-cols-4 { grid-template-columns: repeat(2, 1fr); }
      .grid-cols-3 { grid-template-columns: repeat(2, 1fr); }
      .title { font-size: 22px; }
      .review-trust { display: none; }
      .brand img { height: 42px; }
      .back-btn span { display: none; }
      .back-btn { gap: 0; padding: 8px 10px; }
      .brand-strip { padding: 14px 18px; gap: 12px; }
      .brand-strip-label { display: none; }
      .form-grid { grid-template-columns: 1fr; }
      .field-half { grid-column: 1 / -1; }
      .anrede { grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .anrede-opt { padding: 10px 6px; font-size: 13px; }
      .success-summary { grid-template-columns: repeat(2, 1fr); }
      .reassure { grid-template-columns: 1fr; }
    }
  </style>
</head>

  <script>
    // Auto-apply embedded styling when iframed. ?standalone=1 keeps the
    // centered-card layout but drops our own dim backdrop so the host's
    // overlay shows through cleanly.
    if (window.top !== window.self) {
      if (/[?&]standalone=1\b/.test(location.search)) {
        document.documentElement.classList.add('iframed-standalone');
      } else {
        document.documentElement.classList.add('embedded');
      }
    }
    // Variant flag — read once on load and tag <html> so CSS / JSX can
    // branch on it. e.g. ?variant=B hides the review bar.
    var __m = location.search.match(/[?&]variant=([^&]+)/);
    if (__m) {
      document.documentElement.classList.add('variant-' + __m[1]);
      // Inheritance: F → E. G → F → E. H/I → F → E (branded twins of F).
      if (['F','G','H','I'].includes(__m[1])) document.documentElement.classList.add('variant-E');
      if (['G','H','I'].includes(__m[1]))     document.documentElement.classList.add('variant-F');
    }
  </script>

  <script type="text/babel" data-presets="react">

    // Convert base64 data URI -> blob URL. Some preview sandboxes block

    const LOGO_URI = (() => {
      try {
        const b64 = window.LOGO_URI.split(',', 2)[1];
        const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
        return URL.createObjectURL(new Blob([bytes], { type: 'image/png' }));
      } catch (e) {
        return window.LOGO_URI;
      }
    })();

    // ─────────────────────────── glyph loader ───────────────────────────
    // Single source of truth for option icons: standalone SVG files in
    // ./assets/glyphs/. Designer drops a file in the folder, developer
    // references it by filename. See assets/glyphs/README.md for the contract.
    const __glyphCache = new Map();
    function Glyph({ name, label }) {
      const [svg, setSvg] = useState(__glyphCache.get(name) || null);
      useEffect(() => {
        if (__glyphCache.has(name)) { setSvg(__glyphCache.get(name)); return; }
        let cancelled = false;
        fetch(`./assets/glyphs/${name}.svg`)
          .then(r => r.ok ? r.text() : "")
          .then(text => { if (!cancelled) { __glyphCache.set(name, text); setSvg(text); } })
          .catch(() => { if (!cancelled) setSvg(""); });
        return () => { cancelled = true; };
      }, [name]);
      // Category prefix (shape, location, timing, budget) drives sizing.
      const cat = (name || '').split('-', 1)[0] || 'misc';
      const cls = `glyph glyph--${cat}`;
      if (svg === null) return <span className={`${cls} glyph-loading`} aria-hidden="true" />;
      return <span className={cls} role="img" aria-label={label || name} dangerouslySetInnerHTML={{ __html: svg }} />;
    }

    function App() {

          closeFunnelToHost();

        function onMsg(e) {

        return () => window.removeEventListener('message', onMsg);

      const rawProgress = ((stepIdx + (submitted ? 1 : 0)) / total) * 100;
      // Endowed-progress effect (Nunes & Drèze 2006): show the bar already
      // ~12% filled on step 1 so the user feels they've made a head-start.
      const progress = isF ? 12 + rawProgress * 0.88 : rawProgress;

      const errs = useMemo(() => ({
        name: contact.name.trim().length < 2 ? "Bitte Vor- und Nachname angeben" : null,
        email: !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contact.email) ? "Bitte gültige E-Mail-Adresse" : null,
        phone: contact.phone.replace(/\D/g, "").length < 6 ? "Bitte Telefonnummer" : null,
        plz: !/^\d{4,5}$/.test(contact.plz) ? "Bitte gültige PLZ" : null,
      }), [contact]);

      const formValid = !errs.name && !errs.email && !errs.phone && !errs.plz;

      // Slide direction + outgoing snapshot for the slide-out animation.
      const [direction, setDirection] = useState('forward');
      const [outgoing, setOutgoing] = useState(null); // {stepIdx, step}
      const outgoingTimer = React.useRef(null);
      function startTransition(nextIdx, dir) {
        if (outgoingTimer.current) clearTimeout(outgoingTimer.current);
        setDirection(dir);
        setOutgoing({ stepIdx, step });
        setStepIdx(nextIdx);
        outgoingTimer.current = setTimeout(() => setOutgoing(null), 600);
      }
      function pick(stepId, value) {
        setAnswers((a) => ({ ...a, [stepId]: value }));
        if (STEPS.find(s => s.id === stepId).type !== "form") {
          // Let the microreward play, then transition.
          setTimeout(() => startTransition(Math.min(stepIdx + 1, total - 1), 'forward'), 560);
        }
      }
      function back() {
        if (stepIdx === 0) return;
        startTransition(Math.max(0, stepIdx - 1), 'back');
      }
      function submit() {
        setTouched({ name: true, email: true, phone: true, plz: true });
        if (formValid) setSubmitted(true);
      }

      return (
        <div className="page">
          <div className="card">
            {splash !== 'gone' && (() => {
              const USPS = [
                {
                  label: "Persönlicher Berater meldet sich",
                  svg: (
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                      <circle cx="12" cy="7" r="4"/>
                    </svg>
                  )
                },
                {
                  label: "Über 60 Hersteller im Vergleich",
                  svg: (
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="3" y="3" width="7" height="7" rx="1"/>
                      <rect x="14" y="3" width="7" height="7" rx="1"/>
                      <rect x="14" y="14" width="7" height="7" rx="1"/>
                      <rect x="3" y="14" width="7" height="7" rx="1"/>
                    </svg>
                  )
                },
                {
                  label: "Kostenlos & unverbindlich",
                  svg: (
                    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                      <path d="m9 12 2 2 4-4"/>
                    </svg>
                  )
                },
              ];
              const cur = USPS[Math.min(uspIdx, USPS.length - 1)];
              return (
                <div className={`splash splash--${splash}`} aria-hidden={splash === 'leaving'}>
                  <div className="splash__stage">
                    <div className="splash__usp" key={uspIdx}>
                      <div className="splash__icon">{cur.svg}</div>
                      <p className="splash__label">{cur.label}</p>
                    </div>
                    <div className="splash__bar" aria-hidden="true">
                      <div className="splash__bar-fill" />
                    </div>
                  </div>
                </div>
              );
            })()}
            {exitOpen && (
              <div className="exit-overlay" role="dialog" aria-modal="true" aria-labelledby="exit-title">
                <div className="exit-overlay__inner">
                  <div className="exit-overlay__art" aria-hidden="true">
                    {/* Line-art paper plane being pulled back by a string —
                        "your offer is almost on its way, don't cancel now". */}
                    <svg width="120" height="100" viewBox="0 0 140 110" fill="none"
                         stroke="#1A1D1B" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round">
                      {/* Dashed trail showing the plane's curved path */}
                      <path d="M16 86 Q40 60 70 56 T126 30" strokeDasharray="3 5" opacity="0.45" />

                      {/* Paper plane body */}
                      <g className="exit-art__plane">
                        <path d="M82 28 L130 14 L110 50 Z" />
                        {/* Fold line down the middle */}
                        <path d="M82 28 L110 50" />
                        {/* Inner fold (back wing) */}
                        <path d="M97 38 L110 50" opacity="0.5" />
                      </g>

                      {/* Two small wind / motion arcs behind the plane */}
                      <path d="M70 36 Q78 36 80 30" opacity="0.55" />
                      <path d="M64 44 Q74 44 76 38" opacity="0.4" />
                    </svg>
                  </div>
                  <h2 id="exit-title" className="exit-overlay__title">Wollen Sie wirklich abbrechen?</h2>
                  <p className="exit-overlay__sub">Ihre Angaben werden nicht gespeichert und wir werden Ihnen kein Angebot erstellen können.</p>
                  <button type="button" className="form-cta exit-overlay__primary" onClick={dismissExit}>
                    Zurück zur Eingabe
                  </button>
                  <button type="button" className="exit-overlay__leave" onClick={confirmExit}>
                    Ja, Seite verlassen
                  </button>
                </div>
              </div>
            )}
            <ReviewBar />
            <div className="card-body">
              <Nav stepIdx={stepIdx} total={total} onBack={back} onClose={requestClose} submitted={submitted} />
              <Progress value={progress} />
              {!submitted ? (
                <div className={`step-stage step-stage--${direction}`}>
                  {outgoing && (
                    <div className="step-content step-content--out" key={'out-' + outgoing.stepIdx} aria-hidden="true">
                      <Header title={outgoing.step.title} subtitle={outgoing.step.subtitle} />
                      {outgoing.step.type === "grid" && (
                        <GridStep step={outgoing.step} selected={answers[outgoing.step.id]} onPick={() => {}} />
                      )}
                      {outgoing.step.type === "form" && (
                        <FormStep
                          contact={contact} setContact={setContact}
                          touched={touched} setTouched={setTouched}
                          errs={errs} formValid={formValid} onSubmit={() => {}}
                          isF={isF}
                        />
                      )}
                    </div>
                  )}
                  <div className="step-content step-content--in" key={stepIdx}>
                    <Header
                      title={step.title}
                      subtitle={step.subtitle}
                    />
                    {step.type === "grid" && (
                      <GridStep step={step} selected={answers[step.id]} onPick={(v) => pick(step.id, v)} />
                    )}
                    {step.type === "form" && (
                      <FormStep
                        contact={contact} setContact={setContact}
                        touched={touched} setTouched={setTouched}
                        errs={errs} formValid={formValid} onSubmit={submit}
                        isF={isF}
                      />
                    )}
                  </div>
                </div>
              ) : (
                <Success answers={answers} contact={contact} />
              )}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────── components ───────────────────────────
    function ReviewBar() {
      return (
        <div className="review-bar">
          <div className="review-bar-inner">
            <div className="review-cluster">
              <div className="review-rating">
                <strong>4,3</strong>
                <Stars rating={4.3} />
              </div>
              <span className="review-divider" aria-hidden="true" />
              <div className="review-source">
                <span className="review-source-text">1.195+ Google-Bewertungen</span>
              </div>
            </div>
            <div className="review-trust"><Dot /> Kostenlos & unverbindlich</div>
          </div>
        </div>
      );
    }
    function GoogleG() {
      return (
        <svg width="14" height="14" viewBox="0 0 18 18" aria-hidden="true">
          <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
          <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/>
          <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
          <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/>
        </svg>
      );
    }
    function Stars({ rating }) {
      return (
        <span className="stars" aria-label={`${rating} von 5`}>
          {[0,1,2,3,4].map(i => {
            const fill = Math.max(0, Math.min(1, rating - i));
            return (
              <svg key={i} width="14" height="14" viewBox="0 0 20 20" aria-hidden="true">
                <defs>
                  <linearGradient id={`s-${i}-${rating}`}>
                    <stop offset={`${fill*100}%`} stopColor="currentColor" />
                    <stop offset={`${fill*100}%`} stopColor="currentColor" stopOpacity="0.25" />
                  </linearGradient>
                </defs>
                <path fill={`url(#s-${i}-${rating})`} d="M10 1.5l2.6 5.3 5.9.85-4.25 4.15 1 5.85L10 14.9l-5.25 2.75 1-5.85L1.5 7.65l5.9-.85L10 1.5z"/>
              </svg>
            );
          })}
        </span>
      );
    }
    const Dot = () => <span className="status-dot" aria-hidden="true" />;

    function closeFunnelToHost() {
      try { window.parent.postMessage({ type: 'funnel:close' }, '*'); } catch (e) {}
    }
    function Nav({ stepIdx, total, onBack, onClose, submitted }) {
      const stepNum = submitted ? total : stepIdx + 1;
      return (
        <>
          <div className="nav">
            <button className="back-btn" onClick={onBack} disabled={stepIdx === 0 || submitted} aria-label="Zurück">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M13 8H3M7 4L3 8l4 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" />
              </svg>
              <span>Zurück</span>
            </button>
            <div className="brand">
              <img src={LOGO_URI} alt="biller küchen" />
            </div>
            {/* Desktop: step counter on the right. Mobile: close button. */}
            <div className="step-counter">
              <span className="step-num">{stepNum}</span>
              <span className="step-sep">/</span>
              <span className="step-tot">{total}</span>
            </div>
            <button className="nav-close" onClick={onClose || closeFunnelToHost} aria-label="Schließen">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" />
              </svg>
            </button>
          </div>
          {/* Mobile: step pill pinned to the bottom-right of the viewport. */}
          <div className="step-pill" aria-hidden="true">{stepNum} / {total}</div>
        </>
      );
    }
    function BrandMark() {
      return (
        <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true">
          <rect x="2" y="2" width="18" height="18" rx="4" fill="var(--accent)" />
          <path d="M7 14V8h2.5l1.5 4 1.5-4H15v6" stroke="white" strokeWidth="1.6" fill="none" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function Progress({ value }) {
      return (
        <div className="progress">
          <span className="progress-track" />
          <span className="progress-fill" style={{ width: `${value}%` }} />
        </div>
      );
    }
    function Header({ title, subtitle, timeLeft }) {
      return (
        <div className="header">
          {timeLeft != null && timeLeft > 0 && (
            <div className="time-left" aria-label={`Noch etwa ${timeLeft} Sekunden`}>
              <svg width="11" height="11" viewBox="0 0 12 12" fill="none" aria-hidden="true">
                <circle cx="6" cy="6" r="4.5" stroke="currentColor" strokeWidth="1.2" />
                <path d="M6 3.5V6l1.5 1" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round" />
              </svg>
              <span>Noch ca. {timeLeft} Sek.</span>
            </div>
          )}
          <h1 className="title">{title}</h1>
          {subtitle && <p className="subtitle">{subtitle}</p>}
        </div>
      );
    }

    function GridStep({ step, selected, onPick }) {
      return (
        <>
          <div className={`grid grid-cols-${step.cols}`} style={{"--cols": step.cols}}>
            {step.options.map((opt) => (
              <Card
                key={opt.id}
                selected={selected === opt.id}
                onSelect={() => onPick(opt.id)}
                label={opt.label} hint={opt.hint} glyph={opt.glyph} popular={opt.popular}
              />
            ))}
          </div>
          {step.fallback && (
            <button
              type="button"
              className={`fallback ${selected === step.fallback.id ? "is-selected" : ""}`}
              onClick={() => onPick(step.fallback.id)}
            >
              <Plus /> {step.fallback.label}
            </button>
          )}
        </>
      );
    }
    function ValidCheck() {
      return (
        <span className="valid-check" aria-hidden="true">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
            <path d="M2.5 6.5l2.2 2.2L9.5 3.8" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </span>
      );
    }
    function Plus() {
      return (
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M7 2v10M2 7h10" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" />
        </svg>
      );
    }
    function Card({ selected, onSelect, label, hint, glyph, popular }) {
      // Only bounce on transitions from unselected → selected (not on mount
      // when navigating back to a step where this card was already chosen).
      const [justSel, setJustSel] = React.useState(false);
      const prevSel = React.useRef(selected);
      React.useEffect(() => {
        if (!prevSel.current && selected) {
          setJustSel(true);
          const t = setTimeout(() => setJustSel(false), 600);
          prevSel.current = selected;
          return () => clearTimeout(t);
        }
        prevSel.current = selected;
      }, [selected]);
      return (
        <button
          type="button"
          className={`opt-card ${selected ? "is-selected" : ""} ${justSel ? "is-just-selected" : ""} ${popular ? "is-popular" : ""}`}
          onClick={onSelect}
          aria-pressed={selected}
        >
          {popular && <span className="opt-badge" aria-label="Beliebteste Wahl">Beliebt</span>}
          <span className="opt-check" aria-hidden="true">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
              <path d="M2.5 6.5l2.2 2.2L9.5 3.8" stroke="white" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </span>
          <span className="opt-glyph"><Glyph name={glyph} label={label} /></span>
          <span className="opt-meta">
            <span className="opt-label">{label}</span>
            {hint && <span className="opt-hint">{hint}</span>}
          </span>
        </button>
      );
    }

    function FormStep({ contact, setContact, touched, setTouched, errs, formValid, onSubmit, isF }) {
      const set = (k, v) => setContact((c) => ({ ...c, [k]: v }));
      const blur = (k) => setTouched((t) => ({ ...t, [k]: true }));
      const showErr = (k) => touched[k] && errs[k];
      // Live "valid" — green check appears as user types and field becomes valid.
      const isValid = (k) => contact[k] && contact[k].toString().trim().length > 0 && !errs[k];
      // Linger tooltip — fires after 8s of inactivity on the contact step.
      const [lingered, setLingered] = useState(false);
      const [touchedAny, setTouchedAny] = useState(false);
      useEffect(() => {
        if (!isF) return;
        if (touchedAny) { setLingered(false); return; }
        const t = setTimeout(() => setLingered(true), 8000);
        return () => clearTimeout(t);
      }, [isF, touchedAny, contact]);
      const wrapSet = (k, v) => { setTouchedAny(true); set(k, v); };
      return (
        <div className="form-step">
          {isF && (
            <div className="consultant" role="note">
              <img className="consultant__avatar consultant__avatar--img" src="./assets/avatar-group.png" alt="" />
              <span className="consultant__meta">
                <span className="consultant__name">Ein Mitglied unseres Teams</span>
                <span className="consultant__role">meldet sich in Kürze bei Ihnen</span>
              </span>
            </div>
          )}

          {/* Anrede */}
          <div className="anrede" role="radiogroup" aria-label="Anrede">
            {ANREDE.map(a => (
              <button
                key={a.id} type="button" role="radio"
                aria-checked={contact.anrede === a.id}
                className={`anrede-opt ${contact.anrede === a.id ? "is-selected" : ""}`}
                onClick={() => set("anrede", a.id)}
              >{a.label}</button>
            ))}
          </div>

          <div className="form-grid">
            <label className={`field ${showErr("name") ? "has-error" : ""} ${isValid("name") ? "is-valid" : ""}`}>
              <span className="field-label">Vorname & Nachname*</span>
              <div className="input-wrap">
                <input className="input" type="text" autoComplete="name"
                  value={contact.name} onChange={(e) => wrapSet("name", e.target.value)} onBlur={() => blur("name")}
                  placeholder="Anna Müller" />
                <ValidCheck />
              </div>
              {showErr("name") && <span className="field-err">{errs.name}</span>}
            </label>

            <label className={`field ${showErr("email") ? "has-error" : ""} ${isValid("email") ? "is-valid" : ""}`}>
              <span className="field-label">E-Mail-Adresse*</span>
              <div className="input-wrap">
                <input className="input" type="email" autoComplete="email"
                  value={contact.email} onChange={(e) => wrapSet("email", e.target.value)} onBlur={() => blur("email")}
                  placeholder="anna@beispiel.de" />
                <ValidCheck />
              </div>
              <span className="field-hint">Nur für Ihr Angebot — kein Newsletter, keine Weitergabe.</span>
              {showErr("email") && <span className="field-err">{errs.email}</span>}
              {isF && lingered && (
                <span className="linger-tip" role="status">
                  Warum wir das brauchen: damit wir Ihnen Ihr persönliches Angebot zusenden können.
                </span>
              )}
            </label>

            <label className={`field ${showErr("phone") ? "has-error" : ""} ${isValid("phone") ? "is-valid" : ""}`}>
              <span className="field-label">Telefonnummer*</span>
              <div className="phone-row">
                <select className="phone-country" value={contact.phoneCountry}
                  onChange={(e) => set("phoneCountry", e.target.value)}>
                  {COUNTRIES.map(c => <option key={c.code} value={c.code}>{c.label}</option>)}
                </select>
                <div className="input-wrap">
                  <input className="input" type="tel" autoComplete="tel"
                    value={contact.phone} onChange={(e) => wrapSet("phone", e.target.value)} onBlur={() => blur("phone")}
                    placeholder="151 234 5678" />
                  <ValidCheck />
                </div>
              </div>
              {showErr("phone") && <span className="field-err">{errs.phone}</span>}
            </label>

            <label className={`field ${showErr("plz") ? "has-error" : ""} ${isValid("plz") ? "is-valid" : ""}`}>
              <span className="field-label">Postleitzahl*</span>
              <div className="input-wrap">
                <input className="input" type="text" autoComplete="postal-code" inputMode="numeric"
                  value={contact.plz} onChange={(e) => wrapSet("plz", e.target.value)} onBlur={() => blur("plz")}
                  placeholder="10115" />
                <ValidCheck />
              </div>
              {showErr("plz") && <span className="field-err">{errs.plz}</span>}
            </label>
          </div>

          <div className="cta-row">
            <button type="button" className="form-cta" disabled={!formValid} onClick={onSubmit}>
              <Lock /> Gratis Termin anfragen
            </button>
            <span className="ssl-pill"><Lock small /> SSL-verschlüsselt</span>
            <p className="legal">
              Mit Klick auf den Button akzeptieren Sie unsere <a href="#" onClick={(e) => e.preventDefault()}>AGB</a>. Ihre Angaben werden zur Erbringung unserer Leistungen genutzt — wir kontaktieren Sie per E-Mail, Telefon oder Kurznachricht, um Ihr Angebot zu finalisieren. Daten werden nicht an Dritte weitergegeben. Mehr in der <a href="#" onClick={(e) => e.preventDefault()}>Datenschutzerklärung</a>.
            </p>
          </div>
        </div>
      );
    }
    function Lock({ small }) {
      const s = small ? 12 : 16;
      return (
        <svg width={s} height={s} viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect x="3" y="7" width="10" height="7" rx="1.6" stroke="currentColor" strokeWidth="1.4" />
          <path d="M5.5 7V5a2.5 2.5 0 015 0v2" stroke="currentColor" strokeWidth="1.4" />
        </svg>
      );
    }

    function Success({ answers, contact }) {
      return (
        <div className="success">
          <div className="success-icon">
            <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
              <circle cx="20" cy="20" r="19" stroke="var(--accent)" strokeWidth="1.5" />
              <path d="M12 20.5l5 5L29 14" stroke="var(--accent)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
          </div>
          <h2 className="success-title">Vielen Dank, {contact.name.split(" ")[0] || "Sie"}!</h2>
          <p className="success-sub">
            Wir bereiten Ihren persönlichen Vorschlag vor und melden uns innerhalb von 24 Stunden unter <strong>{contact.email}</strong>.
          </p>
          <div className="success-summary">
            <div><span>Form</span><strong>{labelOf("shape", answers.shape)}</strong></div>
            <div><span>Termin</span><strong>{labelOf("location", answers.location) || "—"}</strong></div>
            <div><span>Zeitraum</span><strong>{labelOf("timing", answers.timing) || "—"}</strong></div>
            <div><span>Budget</span><strong>{labelOf("budget", answers.budget) || "—"}</strong></div>
          </div>
        </div>
      );
    }
    function labelOf(stepId, valueId) {
      const step = STEPS.find(s => s.id === stepId);
      if (!step?.options) return null;
      const opt = step.options.find(o => o.id === valueId) || (step.fallback?.id === valueId ? step.fallback : null);
      return opt?.label || null;
    }

    function Reassurance() {
      const items = [
        { t: "100% kostenlos", s: "Keine versteckten Gebühren" },
        { t: "Unverbindlich",  s: "Kein Kaufzwang, jederzeit kündbar" },
        { t: "DSGVO-konform",  s: "Daten bleiben bei uns" },
      ];
      return (
        <div className="reassure">
          {items.map((i, idx) => (
            <div key={idx} className="reassure-item">
              <span className="reassure-icon"><Check /></span>
              <div>
                <div className="reassure-t">{i.t}</div>
                <div className="reassure-s">{i.s}</div>
              </div>
            </div>
          ))}
        </div>
      );
    }
    function Check() {
      return (
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M4.5 9.2l3 3 6-7" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
        </svg>
      );
    }

    function BrandStrip() {
      return (
        <div className="brand-strip">
          <span className="brand-strip-label">Wir planen mit</span>
          <div className="brand-list">
            {BRANDS.map(b => <span key={b} className="brand-item">{b}</span>)}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
